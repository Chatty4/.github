# Reusable CI for the Chatty Python services (chatty-core, chatty-chat).
#
# Call it from a repo's .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: Chatty4/.github/.github/workflows/python-ci.yml@dev
#       with:
#         needs-postgres: true
#         needs-kafka: true
#         test-env: |
#           SECRET_KEY=ci-not-secret
#           DEBUG=False

name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for setup-python.
        type: string
        default: "3.14"
      working-directory:
        description: Directory that holds requirements.txt and pyproject.toml.
        type: string
        default: "."
      run-tests:
        description: Run pytest. Set to false while a repo has no tests (pytest exits 5 on none).
        type: boolean
        default: true
      needs-postgres:
        description: Start a Postgres 17 service and export DATABASE_URL for the tests.
        type: boolean
        default: false
      postgres-db:
        type: string
        default: test_db
      postgres-user:
        type: string
        default: test_user
      postgres-password:
        type: string
        default: test_pass
      database-url-scheme:
        description: Scheme for DATABASE_URL, e.g. postgresql+asyncpg for SQLAlchemy async.
        type: string
        default: postgres
      needs-redis:
        description: Start a Redis 7 service and export REDIS_URL for the tests.
        type: boolean
        default: false
      needs-kafka:
        description: Start a single-node Kafka 3.9 (KRaft) and export KAFKA_BOOTSTRAP_SERVERS for the tests.
        type: boolean
        default: false
      needs-minio:
        description: Start MinIO, create minio-bucket and export the MINIO_* settings for the tests.
        type: boolean
        default: false
      minio-bucket:
        description: Bucket created when needs-minio is on.
        type: string
        default: chatty
      test-env:
        description: Extra KEY=VALUE lines exported before pytest runs. Not for real secrets.
        type: string
        default: ""
      pre-test-commands:
        description: Shell commands run after the env is set up and before pytest, one per line.
        type: string
        default: ""
      pytest-args:
        description: Extra arguments for pytest, e.g. -m "not integration".
        type: string
        default: ""
      docker-build:
        description: Build the Dockerfile in working-directory (no push), so a broken image fails CI.
        type: boolean
        default: false
      audit:
        description: Check requirements.txt for known vulnerabilities with pip-audit. Never fails the run.
        type: boolean
        default: true
      mypy:
        description: Type-check with mypy (config in the repo's pyproject.toml). Uses test-env.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      # Install only the pinned ruff from requirements.txt, so lint stays fast and matches local runs.
      - name: Install ruff
        run: |
          ruff_pin="$(grep -iE '^ruff==' requirements.txt || true)"
          pip install "${ruff_pin:-ruff}"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        # An empty image skips the service container when the repo doesn't need Postgres.
        image: ${{ inputs.needs-postgres && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.postgres-user }} -d ${{ inputs.postgres-db }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: ${{ inputs.needs-redis && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      kafka:
        image: ${{ inputs.needs-kafka && 'apache/kafka:3.9.0' || '' }}
        # As in chatty-infra's compose: advertises 127.0.0.1, so the tests on the runner reach it,
        # and no topic is created by a typo (tests create their own).
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s
    env:
      # Throwaway root login for the CI MinIO, like the Postgres test credentials.
      CI_MINIO_USER: ci_minio_user
      CI_MINIO_PASSWORD: ci_minio_password
    steps:
      - uses: actions/checkout@v5

      # A step, not a service container: services can't pass the "server /data" command MinIO needs.
      # Started first, so it boots while pip installs. Same image and digest as chatty-infra's
      # docker-compose.yml; update both together.
      - name: Start MinIO
        if: inputs.needs-minio
        run: >-
          docker run -d --name minio -p 127.0.0.1:9000:9000
          -e MINIO_ROOT_USER="$CI_MINIO_USER" -e MINIO_ROOT_PASSWORD="$CI_MINIO_PASSWORD"
          -e MC_HOST_local="http://$CI_MINIO_USER:$CI_MINIO_PASSWORD@localhost:9000"
          cgr.dev/chainguard/minio:latest@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
          server /data

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 127.0.0.1, not localhost: same rule as local dev (see chatty-core CLAUDE.md).
      - name: Export DATABASE_URL
        if: inputs.needs-postgres
        run: >-
          echo "DATABASE_URL=${{ inputs.database-url-scheme }}://${{ inputs.postgres-user }}:${{ inputs.postgres-password }}@127.0.0.1:5432/${{ inputs.postgres-db }}"
          >> "$GITHUB_ENV"

      - name: Export REDIS_URL
        if: inputs.needs-redis
        run: echo "REDIS_URL=redis://127.0.0.1:6379/0" >> "$GITHUB_ENV"

      - name: Export KAFKA_BOOTSTRAP_SERVERS
        if: inputs.needs-kafka
        run: echo "KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092" >> "$GITHUB_ENV"

      # The tests use the root login, so they can use every prefix; the per-service users and
      # policies are created by chatty-infra's setup.bat, not here. Both URLs are the same on a
      # runner: there is no separate address for a browser.
      - name: Wait for MinIO, create the bucket, export MINIO_*
        if: inputs.needs-minio
        env:
          MINIO_BUCKET: ${{ inputs.minio-bucket }}
        run: |
          for _ in $(seq 1 30); do
            docker exec minio mc ready local >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec minio mc ready local || { docker logs minio; exit 1; }
          docker exec minio mc mb --ignore-existing "local/$MINIO_BUCKET"
          {
            echo "MINIO_INTERNAL_URL=http://127.0.0.1:9000"
            echo "MINIO_PUBLIC_URL=http://127.0.0.1:9000"
            echo "MINIO_ACCESS_KEY=$CI_MINIO_USER"
            echo "MINIO_SECRET_KEY=$CI_MINIO_PASSWORD"
            echo "MINIO_BUCKET=$MINIO_BUCKET"
          } >> "$GITHUB_ENV"

      - name: Export test env
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: printf '%s\n' "$TEST_ENV" | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      # Passed through env, not inlined with ${{ }}, so the commands are never templated into the script.
      - name: Pre-test checks
        if: inputs.pre-test-commands != ''
        env:
          PRE_TEST_COMMANDS: ${{ inputs.pre-test-commands }}
        run: bash -eo pipefail -xc "$PRE_TEST_COMMANDS"

      # eval keeps quoted args together, e.g. -m "not integration" stays one -m value.
      - name: pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: eval "pytest $PYTEST_ARGS"

  docker:
    name: Docker build
    if: inputs.docker-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      # Build only: nothing is pushed. Catches a broken Dockerfile or .dockerignore before a deploy does.
      - name: docker build
        run: docker build .

  audit:
    name: Audit
    if: inputs.audit
    runs-on: ubuntu-latest
    # Non-blocking for now: a finding shows as a failed job, but the run and the PR stay green.
    continue-on-error: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      # requirements.txt is fully pinned (pip freeze), so the pins are checked as they are,
      # without installing them.
      - name: pip-audit
        run: pip-audit --disable-pip --no-deps --progress-spinner off -r requirements.txt

  types:
    name: Types
    if: inputs.mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      # mypy needs the real packages and their stubs (django-stubs, ...) to check against.
      # Same pin rule as ruff: the mypy== line from requirements.txt if there is one.
      - name: Install dependencies and mypy
        run: |
          pip install -r requirements.txt
          mypy_pin="$(grep -iE '^mypy==' requirements.txt || true)"
          pip install "${mypy_pin:-mypy==1.15.0}"

      # The django-stubs plugin imports the settings, which read env variables (SECRET_KEY, ...).
      - name: Export test env
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: printf '%s\n' "$TEST_ENV" | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: mypy
        run: mypy .
