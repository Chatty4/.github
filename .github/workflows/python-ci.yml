# Reusable CI for the Chatty Python services (chatty-core, chatty-chat).
#
# Call it from a repo's .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: Chatty4/.github/.github/workflows/python-ci.yml@dev
#       with:
#         needs-postgres: true
#         test-env: |
#           SECRET_KEY=ci-not-secret
#           DEBUG=False

name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for setup-python.
        type: string
        default: "3.14"
      working-directory:
        description: Directory that holds requirements.txt and pyproject.toml.
        type: string
        default: "."
      run-tests:
        description: Run pytest. Set to false while a repo has no tests (pytest exits 5 on none).
        type: boolean
        default: true
      needs-postgres:
        description: Start a Postgres 17 service and export DATABASE_URL for the tests.
        type: boolean
        default: false
      postgres-db:
        type: string
        default: test_db
      postgres-user:
        type: string
        default: test_user
      postgres-password:
        type: string
        default: test_pass
      database-url-scheme:
        description: Scheme for DATABASE_URL, e.g. postgresql+asyncpg for SQLAlchemy async.
        type: string
        default: postgres
      needs-redis:
        description: Start a Redis 7 service and export REDIS_URL for the tests.
        type: boolean
        default: false
      test-env:
        description: Extra KEY=VALUE lines exported before pytest runs. Not for real secrets.
        type: string
        default: ""
      pre-test-commands:
        description: Shell commands run after the env is set up and before pytest, one per line.
        type: string
        default: ""
      pytest-args:
        description: Extra arguments for pytest, e.g. -m "not integration".
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      # Install only the pinned ruff from requirements.txt, so lint stays fast and matches local runs.
      - name: Install ruff
        run: |
          ruff_pin="$(grep -iE '^ruff==' requirements.txt || true)"
          pip install "${ruff_pin:-ruff}"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        # An empty image skips the service container when the repo doesn't need Postgres.
        image: ${{ inputs.needs-postgres && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.postgres-user }} -d ${{ inputs.postgres-db }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: ${{ inputs.needs-redis && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 127.0.0.1, not localhost: same rule as local dev (see chatty-core CLAUDE.md).
      - name: Export DATABASE_URL
        if: inputs.needs-postgres
        run: >-
          echo "DATABASE_URL=${{ inputs.database-url-scheme }}://${{ inputs.postgres-user }}:${{ inputs.postgres-password }}@127.0.0.1:5432/${{ inputs.postgres-db }}"
          >> "$GITHUB_ENV"

      - name: Export REDIS_URL
        if: inputs.needs-redis
        run: echo "REDIS_URL=redis://127.0.0.1:6379/0" >> "$GITHUB_ENV"

      - name: Export test env
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: printf '%s\n' "$TEST_ENV" | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      # Passed through env, not inlined with ${{ }}, so the commands are never templated into the script.
      - name: Pre-test checks
        if: inputs.pre-test-commands != ''
        env:
          PRE_TEST_COMMANDS: ${{ inputs.pre-test-commands }}
        run: bash -eo pipefail -xc "$PRE_TEST_COMMANDS"

      # eval keeps quoted args together, e.g. -m "not integration" stays one -m value.
      - name: pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: eval "pytest $PYTEST_ARGS"
